# CI: a cada push ou pull request, o GitHub cria uma máquina Ubuntu limpa e roda estes passos.
# Se algum falhar, o commit aparece com ❌ no GitHub.
name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Estilo (ruff)
        run: |
          ruff check scripts tests
          ruff format --check scripts tests

      - name: Testes (pytest)
        run: pytest -v

      # Reprodutibilidade: a partir dos brutos versionados, o pipeline tem de gerar exatamente
      # a mesma tabela final e o mesmo relatório que estão no repositório.
      # 01 e 02 ficam de fora para não consultar as APIs da FGV e do IBGE a cada push.
      - name: Pipeline 03–06 reproduz os resultados versionados
        run: |
          for script in scripts/0[3-6]*.py; do python "$script"; done
          git diff --exit-code -- dados/tratados entregas/relatorio_rmc.html
